[project]
name = "ktru-autofill"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "lxml>=5.1",
  "rapidfuzz>=3.6",
  "rank-bm25>=0.2.2",
  "pymorphy3>=2.0",
  "pymorphy3-dicts-ru>=2.4",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "sse-starlette>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
